# 303호스튜디오 관리자 설정 (Sveltia CMS)
# 배포할 때 아래 repo 값을 실제 GitHub 저장소(예: 303studio/portfolio)로 바꿉니다.
backend:
  name: github
  repo: hos1x/303studio-website
  branch: main

locale: ko
site_url: https://www.303studio.net
display_url: https://www.303studio.net
logo_url: /assets/brand/logo-green.png

# 관리자에서 올린 이미지가 저장되는 위치
media_folder: assets/uploads
public_folder: /assets/uploads

# 업로드한 사진을 자동으로 WebP로 바꾸고 긴 변 2400px로 줄여 사이트를 가볍게 유지합니다.
media_libraries:
  default:
    config:
      max_file_size: 20000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

collections:
  - name: content
    label: 사이트 콘텐츠
    files:
      # ---------------- 작업물 ----------------
      - name: works
        label: 작업물
        file: content/works.json
        format: json
        fields:
          - name: works
            label: 작업물 목록
            label_singular: 작업물
            widget: list
            summary: "{{fields.title}} ({{fields.year}}, {{fields.category}})"
            hint: 위에 있을수록 사이트에서 먼저 보입니다. 끌어서 순서를 바꿀 수 있어요.
            fields:
              - { name: title, label: 제목, widget: string }
              - { name: year, label: 연도, widget: string, hint: "예: 2025" }
              - name: category
                label: 분류
                widget: relation
                collection: content
                file: site
                search_fields: ["categories.*.name"]
                value_field: "categories.*.name"
                display_fields: ["categories.*.name"]
                hint: 분류 목록은 '사이트 정보 → 작업 분류'에서 추가·수정할 수 있습니다.
              - { name: client, label: 클라이언트, widget: string, required: false }
              - { name: role, label: 맡은 역할, widget: string, required: false, hint: "예: 기획, 연출, 편집" }
              - { name: featured, label: 홈 대표 작업에 노출, widget: boolean, default: false }
              - name: cover
                label: 썸네일 (선택)
                widget: image
                required: false
                hint: 비워 두면 아래 상세 콘텐츠의 YouTube·Vimeo 링크에서 썸네일을 자동으로 가져옵니다. 다른 이미지를 쓰고 싶을 때만 올리세요. Instagram만 있는 작업은 Instagram이 썸네일을 공개하지 않으므로 직접 올려 주세요.
              - name: description
                label: 소개
                widget: markdown
                required: false
                modes: [rich_text]
                buttons: [bold, underline, strikethrough, italic]
                editor_components: []
                hint: 글자를 선택한 뒤 위의 버튼으로 굵게·밑줄·취소선·기울임을 줄 수 있어요. 홈페이지에서는 가운데 정렬로 보여요.
              - name: media
                label: 상세 페이지 콘텐츠
                label_singular: 콘텐츠
                widget: list
                required: false
                summary: "{{fields.caption}} {{fields.url}}"
                hint: >-
                  YouTube, Vimeo, Instagram 링크를 붙여 넣거나 이미지를 올리세요.
                  첫 번째 영상이 썸네일의 '영상 재생' 버튼으로 재생됩니다.
                  Instagram은 링크와 이미지를 같이 넣으면 썸네일 카드, 링크만 넣으면 Instagram 임베드로 보입니다.
                fields:
                  - { name: url, label: "링크 (YouTube, Vimeo, Instagram)", widget: string, required: false }
                  - { name: image, label: 이미지, widget: image, required: false }
                  - { name: caption, label: 설명, widget: string, required: false }
                  - name: ratio
                    label: 영상 비율
                    widget: select
                    required: false
                    default: 자동
                    options: [자동, "16:9", "9:16", "1:1", "4:5", "4:3", "21:9"]
                    hint: 보통은 자동으로 두세요. YouTube 쇼츠는 세로, Vimeo는 실제 비율로 자동 인식됩니다. 쇼츠 주소가 아닌 YouTube 세로 영상만 9:16을 고르면 됩니다.

      # ---------------- 사이트 정보 ----------------
      - name: site
        label: 사이트 정보
        file: content/site.json
        format: json
        fields:
          - { name: tagline, label: 메인 문구, widget: text, hint: 홈과 About 상단에 크게 보입니다. 줄을 바꾸면 사이트에서도 줄이 바뀝니다. }
          - { name: intro, label: 브랜드 소개, widget: text, hint: 메인 문구 아래 작게 보이는 설명입니다. }
          - name: categories
            label: 작업 분류
            label_singular: 분류
            widget: list
            summary: "{{fields.name}}"
            hint: Work 페이지의 분류 버튼 순서입니다. 작업이 하나도 없는 분류는 사이트에 표시되지 않습니다.
            fields:
              - { name: name, label: 분류 이름, widget: string }
          - name: process
            label: 제작 과정 (About)
            widget: object
            fields:
              - { name: desc, label: 설명, widget: text }
              - name: steps
                label: 단계
                label_singular: 단계
                widget: list
                summary: "{{fields.en}} / {{fields.ko}}"
                fields:
                  - { name: en, label: 영문 이름, widget: string }
                  - { name: ko, label: 한글 이름, widget: string }
                  - { name: image, label: 원형 사진, widget: image, required: false, hint: 사이트에서는 흑백으로 보입니다. }
          - name: clients
            label: 함께한 브랜드
            label_singular: 브랜드
            widget: list
            required: false
            summary: "{{fields.name}}"
            hint: 로고를 추가하면 개수에 맞춰 자동으로 칸이 채워집니다. 배경이 투명한 PNG나 SVG가 가장 잘 보입니다.
            fields:
              - { name: name, label: 브랜드 이름, widget: string }
              - { name: logo, label: 로고, widget: image, required: false }
          - name: company
            label: 회사 정보 (하단)
            widget: object
            fields:
              - { name: name, label: 회사 이름, widget: string }
              - { name: bizNo, label: 사업자등록번호, widget: string }
              - { name: ceo, label: 대표, widget: string }
              - { name: phone, label: 전화번호, widget: string }
              - { name: email, label: 이메일, widget: string }
              - { name: youtube, label: YouTube 링크, widget: string, required: false }
              - { name: instagram, label: Instagram 링크, widget: string, required: false }
              - { name: copyright, label: 저작권 문구, widget: string }
